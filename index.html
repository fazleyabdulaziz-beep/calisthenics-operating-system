<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d120e">
  <meta name="description" content="Calisthenics OS — your personal training command center.">
  <title>Calisthenics OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark">C<span>.</span></div>
    <div class="loader"></div>
    <p>BUILDING YOUR MOMENTUM</p>
  </div>

  <section id="authView" class="auth-wrap hidden">
    <div class="auth-brand"><div class="brand-mark">C<span>.</span></div><div><b>CALISTHENICS OS</b><small>TRAIN WITH INTENTION</small></div></div>
    <div class="auth-card">
      <div class="eyebrow">YOUR TRAINING SPACE</div>
      <h1 id="authTitle">Welcome back.</h1>
      <p class="muted" id="authSubtitle">Sign in and keep your momentum.</p>
      <form id="authForm">
        <label>Username<input id="authUsername" autocomplete="username" minlength="3" required placeholder="your_username"></label>
        <label>Password<input id="authPassword" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"></label>
        <label id="confirmWrap" class="hidden">Confirm password<input id="authConfirm" type="password" minlength="8" placeholder="Repeat password"></label>
        <button class="btn primary full" id="authSubmit">Sign in <span>→</span></button>
      </form>
      <p class="auth-switch"><span id="switchText">New here?</span> <button class="text-btn" id="switchAuth" type="button">Create account</button></p>
      <div id="authError" class="error-text"></div>
    </div>
    <p class="auth-foot">CONSISTENCY OVER INTENSITY.</p>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="side-brand"><div class="brand-mark">C<span>.</span></div><div><b>CALISTHENICS</b><small>OS / TRAINING</small></div></div>
      <div class="side-label">WORKSPACE</div>
      <nav id="mainNav">
        <button class="nav-item active" data-page="dashboard"><i>⌂</i> Dashboard</button>
        <button class="nav-item" data-page="routines"><i>▤</i> My routines</button>
        <button class="nav-item" data-page="workout"><i>◎</i> Workout log</button>
        <button class="nav-item" data-page="progression"><i>↗</i> Progression</button>
        <button class="nav-item" data-page="history"><i>◷</i> History</button>
        <button class="nav-item" data-page="friends"><i>♧</i> Friends <span id="friendBadge" class="nav-badge hidden">0</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="mini-profile"><div class="avatar" id="sideAvatar">U</div><div class="profile-meta"><b id="sideName">Athlete</b><small>MEMBER</small></div><button id="logoutBtn" class="icon-btn" title="Log out">↗</button></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button id="mobileMenu" class="icon-btn mobile-only">☰</button><div><div class="eyebrow" id="topEyebrow">OVERVIEW</div><div class="top-title" id="topTitle">Dashboard</div></div><div class="top-actions"><span class="live-dot"></span><span class="muted tiny">SYNCED</span><div class="avatar small" id="topAvatar">U</div></div></header>
      <div id="pageContent" class="page-content"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
